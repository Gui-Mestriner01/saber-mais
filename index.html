<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela toda nos celulares com "notch";
         as barras do app respeitam a área segura (env(safe-area-inset-*)) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title> Saber+ </title>
    <meta name="description" content="Saber+: aulas gamificadas. O professor cria atividades e os alunos aprendem jogando." />

    <!-- Fonte do site. Antes cada folha de estilo pedia a fonte de novo (um
         @import por arquivo), e isso segurava a primeira pintura da tela. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" />

    <!-- App instalável (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1A6FC4" />
    <link rel="icon" type="image/png" href="/icones/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Saber+" />
  </head>
  
  <body>
    <!-- WIDGET OFICIAL DO VLIBRAS -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <!-- VLibras (tradução em Libras): carrega depois da página, para não
         atrasar o que o aluno vê primeiro. -->
    <script defer src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.addEventListener('load', () => {
        try { new window.VLibras.Widget('https://vlibras.gov.br/app'); } catch { /* sem Libras, o site segue */ }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
